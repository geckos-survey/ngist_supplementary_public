name: ngistenv
channels:
  - conda-forge
  - default

dependencies:
  - python=3.11
  - astropy
  - numpy
  - scipy
  - pyqt
  - matplotlib
  - spectral-cube
  - extinction
  - ipython
  - jupyter
  - h5py
  - joblib
  - tqdm
  - multiprocess
  - pip
  - pip:
    - printStatus
    - ppxf
    - emcee
    - plotbin
    - vorbin
    - plotly
    - pandas
